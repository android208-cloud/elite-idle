<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Орбитальная Стыковка</title>
    <style>
        :root {
            --hud-green: #00ff66;
            --hud-amber: #ffaa00;
            --hud-red: #ff3333;
            --bg-dark: #050805;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Блокировка жестов браузера */
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            background-color: #000;
            color: var(--hud-green);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Экран камеры */
        #monitor {
            position: relative;
            flex: 1;
            width: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            border-bottom: 3px solid #222;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Эффект старого монитора (Scanlines + Виньетка) */
        #monitor::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            background-size: 100% 4px, 100% 100%;
            pointer-events: none;
        }

        /* Панель управления */
        #controls {
            height: 38dvh;
            background: #111;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border-top: 2px solid #333;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.8);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px;
            position: relative;
        }
        .group-title {
            position: absolute;
            top: 5px;
            font-size: 10px;
            color: #666;
            letter-spacing: 1px;
        }

        /* Крестовина (D-PAD) для смещения */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
            margin-top: 10px;
        }
        
        /* Панель вращения и тяги */
        .rot-pad {
            display: grid;
            grid-template-columns: repeat(2, 65px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            color: var(--hud-green);
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #0a0a0a;
            transition: transform 0.05s, box-shadow 0.05s, background 0.1s;
        }
        .btn:active, .btn.active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0a0a0a;
            background: #004422;
            border-color: var(--hud-green);
        }
        .btn-forward { color: var(--hud-amber); }
        .btn-forward:active, .btn-forward.active { background: #443300; border-color: var(--hud-amber); }

        /* Оверлей старта/конца игры */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        #overlay h1 { margin-bottom: 10px; font-size: 24px; text-shadow: 0 0 10px var(--hud-green); }
        #overlay p { color: #aaa; font-size: 14px; max-width: 300px; margin-bottom: 30px; line-height: 1.4;}
        #start-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: transparent;
            color: var(--hud-green);
            border: 2px solid var(--hud-green);
            border-radius: 5px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }
    </style>
</head>
<body>

    <div id="monitor">
        <canvas id="gameCanvas"></canvas>
        <div id="overlay">
            <h1 id="status-title">СИСТЕМА СТЫКОВКИ</h1>
            <p id="status-desc">Станция вращается и дрейфует. <br><br>1. Выровняйте прицел по центру шлюза.<br>2. Синхронизируйте скорость вращения.<br>3. Совместите маркеры (треугольники) и плавно приближайтесь.</p>
            <button id="start-btn">ИНИЦИАЛИЗАЦИЯ</button>
        </div>
    </div>

    <div id="controls">
        <!-- Левый блок: Смещение X/Y -->
        <div class="control-group">
            <div class="group-title">МАНЕВР (X/Y)</div>
            <div class="d-pad">
                <div></div>
                <div class="btn" data-action="up">▲</div>
                <div></div>
                <div class="btn" data-action="left">◄</div>
                <div class="btn" style="font-size:10px; border:none; background:transparent; box-shadow:none; color:#555;">Авто<br>тормоз</div>
                <div class="btn" data-action="right">►</div>
                <div></div>
                <div class="btn" data-action="down">▼</div>
                <div></div>
            </div>
        </div>

        <!-- Правый блок: Вращение и Сближение -->
        <div class="control-group">
            <div class="group-title">КРЕН / ТЯГА (Z)</div>
            <div class="rot-pad">
                <div class="btn" data-action="ccw">↺</div>
                <div class="btn" data-action="cw">↻</div>
                <div class="btn btn-forward" data-action="forward">ТЯГА<br>+</div>
                <div class="btn btn-forward" data-action="backward">ТОРМ<br>-</div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const statusTitle = document.getElementById('status-title');
    const statusDesc = document.getElementById('status-desc');

    // Настройка размеров Canvas под экран
    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Звуковой движок (Web Audio API)
    let audioCtx;
    let thrusterOsc, thrusterGain;
    
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Генератор белого шума для двигателей
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            // Фильтр для создания звука "шипения" газа
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 800;

            thrusterGain = audioCtx.createGain();
            thrusterGain.gain.value = 0;

            noise.connect(filter);
            filter.connect(thrusterGain);
            thrusterGain.connect(audioCtx.destination);
            noise.start();
        }
    }

    function playBeep(freq = 440, duration = 0.1, type = 'sine') {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // Игровые переменные
    let gameActive = false;
    let stars = [];
    const numStars = 150;

    let player = { x: 0, y: 0, vx: 0, vy: 0, angle: 0, vAngle: 0, z: 100, vz: 0 };
    let target = { x: 0, y: 0, vx: 0, vy: 0, angle: 0, vAngle: 0 };
    
    const inputs = { up: false, down: false, left: false, right: false, ccw: false, cw: false, forward: false, backward: false };

    // Инициализация звезд
    for(let i=0; i<numStars; i++) {
        stars.push({
            x: (Math.random() - 0.5) * 2000,
            y: (Math.random() - 0.5) * 2000,
            size: Math.random() * 2 + 0.5
        });
    }

    function resetGame() {
        player = { 
            x: (Math.random() - 0.5) * 150, 
            y: (Math.random() - 0.5) * 150, 
            vx: 0, vy: 0, 
            angle: 0, 
            vAngle: (Math.random() - 0.5) * 0.02, 
            z: 120, // Дистанция
            vz: 0 
        };
        
        // Цель вращается с постоянной скоростью и немного дрейфует
        target = { 
            x: 0, y: 0, 
            vx: (Math.random() - 0.5) * 0.2, 
            vy: (Math.random() - 0.5) * 0.2, 
            angle: Math.random() * Math.PI * 2, 
            vAngle: (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 0.02 + 0.015) 
        };
        gameActive = true;
        overlay.style.display = 'none';
    }

    // Обработка нажатий (Мультитач)
    const buttons = document.querySelectorAll('.btn[data-action]');
    buttons.forEach(btn => {
        const action = btn.getAttribute('data-action');
        
        const start = (e) => { e.preventDefault(); inputs[action] = true; btn.classList.add('active'); };
        const end = (e) => { e.preventDefault(); inputs[action] = false; btn.classList.remove('active'); };

        btn.addEventListener('touchstart', start, {passive: false});
        btn.addEventListener('touchend', end, {passive: false});
        btn.addEventListener('touchcancel', end, {passive: false});
        
        // Для теста с ПК
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
        btn.addEventListener('mouseleave', end);
    });

    startBtn.addEventListener('click', () => {
        initAudio();
        playBeep(880, 0.2, 'square');
        resetGame();
    });

    // Физика и логика
    const thrustPower = 0.08;
    const rotPower = 0.0004;
    const zPower = 0.015;
    let beepTimer = 0;

    function update() {
        if (!gameActive) return;

        let isThrusting = false;

        // Управление смещением (относительно текущего поворота камеры!)
        let moveX = 0;
        let moveY = 0;
        if (inputs.up) { moveY -= thrustPower; isThrusting = true; }
        if (inputs.down) { moveY += thrustPower; isThrusting = true; }
        if (inputs.left) { moveX -= thrustPower; isThrusting = true; }
        if (inputs.right) { moveX += thrustPower; isThrusting = true; }

        // Перевод вектора тяги из экранных координат в мировые
        player.vx += moveX * Math.cos(player.angle) - moveY * Math.sin(player.angle);
        player.vy += moveX * Math.sin(player.angle) + moveY * Math.cos(player.angle);

        // Вращение (чистая ньютоновская физика, без автоторможения)
        if (inputs.cw) { player.vAngle += rotPower; isThrusting = true; }
        if (inputs.ccw) { player.vAngle -= rotPower; isThrusting = true; }

        // Сближение
        if (inputs.forward) { player.vz -= zPower; isThrusting = true; }
        if (inputs.backward) { player.vz += zPower; isThrusting = true; }

        // Звук двигателей
        if (thrusterGain) {
            thrusterGain.gain.setTargetAtTime(isThrusting ? 0.15 : 0, audioCtx.currentTime, 0.05);
        }

        // Применение скоростей + легкое "автоторможение" для X/Y/Z (симуляция системы стабилизации)
        player.x += player.vx;
        player.y += player.vy;
        player.vx *= 0.985; 
        player.vy *= 0.985;

        player.z += player.vz;
        player.vz *= 0.99;

        player.angle += player.vAngle;

        // Движение цели
        target.x += target.vx;
        target.y += target.vy;
        // Ограничение дрейфа цели
        if(Math.abs(target.x) > 100) target.vx *= -1;
        if(Math.abs(target.y) > 100) target.vy *= -1;
        target.angle += target.vAngle;

        // Ограничение максимальной дистанции
        if (player.z > 150) { player.z = 150; player.vz = 0; }

        // Звуковой радар при сближении
        if (player.z < 50) {
            beepTimer++;
            let beepInterval = Math.max(5, Math.floor(player.z));
            if (beepTimer >= beepInterval) {
                playBeep(600, 0.05);
                beepTimer = 0;
            }
        }

        // ПРОВЕРКА СТЫКОВКИ (Дистанция <= 0)
        if (player.z <= 0) {
            player.z = 0;
            gameActive = false;
            if(thrusterGain) thrusterGain.gain.value = 0;

            // Расчет погрешностей
            const distErr = Math.hypot(target.x - player.x, target.y - player.y);
            const rotSpeedErr = Math.abs(target.vAngle - player.vAngle);
            
            // Нормализация разницы углов (-PI до PI)
            let angleDiff = (target.angle - player.angle) % (Math.PI * 2);
            if (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            if (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            const angleErr = Math.abs(angleDiff * (180 / Math.PI)); // в градусах

            const hitSpeed = Math.abs(player.vz);

            // Условия победы
            const posOK = distErr < 15;
            const spinOK = rotSpeedErr < 0.005;
            const angleOK = angleErr < 15;
            const speedOK = hitSpeed < 0.6;

            if (posOK && spinOK && angleOK && speedOK) {
                playBeep(440, 0.1, 'square');
                setTimeout(() => playBeep(880, 0.4, 'square'), 150);
                statusTitle.innerText = "СТЫКОВКА УСПЕШНА";
                statusTitle.style.color = "var(--hud-green)";
                statusDesc.innerHTML = `Отличная работа, пилот!<br><br>Погрешность центра: ${distErr.toFixed(1)}м<br>Погрешность угла: ${angleErr.toFixed(1)}°`;
                startBtn.innerText = "НОВАЯ МИССИЯ";
            } else {
                playBeep(150, 0.8, 'sawtooth');
                statusTitle.innerText = "АВАРИЯ ШЛЮЗА";
                statusTitle.style.color = "var(--hud-red)";
                
                let reasons = [];
                if (!posOK) reasons.push("Сильное смещение от центра");
                if (!spinOK) reasons.push("Не синхронизировано вращение");
                if (!angleOK) reasons.push("Не совмещены маркеры угла");
                if (!speedOK) reasons.push("Слишком высокая скорость сближения");

                statusDesc.innerHTML = `Причины аварии:<br><span style="color:var(--hud-amber)">- ${reasons.join('<br>- ')}</span>`;
                startBtn.innerText = "ПОВТОРИТЬ";
            }
            overlay.style.display = 'flex';
        }
    }

    // Отрисовка
    function draw() {
        ctx.fillStyle = '#050805';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // 1. МИР (Звезды и Станция) - вращаются в сторону, обратную вращению игрока
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-player.angle); // Вращение камеры

        // Отрисовка звезд (зависит только от угла, т.к. они бесконечно далеко)
        ctx.fillStyle = '#ffffff';
        stars.forEach(star => {
            ctx.globalAlpha = Math.random() * 0.5 + 0.5;
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });
        ctx.globalAlpha = 1.0;

        // Позиция цели относительно игрока
        const dx = target.x - player.x;
        const dy = target.y - player.y;
        
        // Масштаб зависит от дистанции Z (эффект перспективы)
        const fov = 300;
        const scale = fov / Math.max(player.z + 10, 1); // +10 чтобы не делить на 0

        ctx.save();
        // Смещаем станцию с учетом перспективы (чем ближе, тем сильнее смещение на экране)
        ctx.translate(dx * (scale * 0.3), dy * (scale * 0.3)); 
        ctx.rotate(target.angle); // Собственное вращение станции
        ctx.scale(scale, scale);

        // --- РИСУЕМ СТАНЦИЮ ---
        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 2 / scale; // Сохраняем толщину линий независимой от зума

        // Внешний корпус (восьмиугольник)
        ctx.beginPath();
        const rOut = 60;
        for (let i = 0; i < 8; i++) {
            const a = (i * Math.PI) / 4 + (Math.PI / 8);
            if (i === 0) ctx.moveTo(Math.cos(a)*rOut, Math.sin(a)*rOut);
            else ctx.lineTo(Math.cos(a)*rOut, Math.sin(a)*rOut);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(0, 20, 10, 0.9)';
        ctx.fill();
        ctx.stroke();

        // Солнечные панели / конструкции
        ctx.beginPath();
        ctx.moveTo(-rOut, 0); ctx.lineTo(-rOut - 80, 0);
        ctx.moveTo(rOut, 0); ctx.lineTo(rOut + 80, 0);
        ctx.stroke();

        // Внутреннее кольцо шлюза
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffaa00';
        ctx.stroke();

        // Глубина шлюза (эффект 3D туннеля)
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI * 2);
        ctx.strokeStyle = '#008833';
        ctx.stroke();

        // МАРКЕР ОРИЕНТАЦИИ СТАНЦИИ (Треугольник сверху)
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath();
        ctx.moveTo(0, -28);
        ctx.lineTo(-6, -38);
        ctx.lineTo(6, -38);
        ctx.closePath();
        ctx.fill();

        ctx.restore(); // Конец отрисовки станции
        ctx.restore(); // Конец трансформации камеры

        // 2. ИНТЕРФЕЙС КАМЕРЫ (HUD) - статичен относительно экрана
        drawHUD(cx, cy);
    }

    function drawHUD(cx, cy) {
        ctx.strokeStyle = '#00ff66';
        ctx.fillStyle = '#00ff66';
        ctx.lineWidth = 1.5;

        // Центральный прицел (наш корабль)
        const reticleRadius = 60;
        ctx.beginPath();
        ctx.arc(cx, cy, reticleRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 255, 102, 0.4)';
        ctx.stroke();

        // Перекрестие
        ctx.beginPath();
        ctx.moveTo(cx - 15, cy); ctx.lineTo(cx - 5, cy);
        ctx.moveTo(cx + 5, cy); ctx.lineTo(cx + 15, cy);
        ctx.moveTo(cx, cy - 15); ctx.lineTo(cx, cy - 5);
        ctx.moveTo(cx, cy + 5); ctx.lineTo(cx, cy + 15);
        ctx.strokeStyle = '#00ff66';
        ctx.stroke();

        // НАШ МАРКЕР ОРИЕНТАЦИИ (Нужно совместить с желтым треугольником станции)
        ctx.beginPath();
        ctx.moveTo(cx, cy - reticleRadius + 2);
        ctx.lineTo(cx - 8, cy - reticleRadius - 12);
        ctx.lineTo(cx + 8, cy - reticleRadius - 12);
        ctx.closePath();
        ctx.strokeStyle = '#00ff66';
        ctx.stroke();

        // Вектор смещения (показывает, куда нужно лететь, чтобы отцентрироваться)
        // Переводим мировое смещение в экранное
        const dx = target.x - player.x;
        const dy = target.y - player.y;
        const screenDx = dx * Math.cos(-player.angle) - dy * Math.sin(-player.angle);
        const screenDy = dx * Math.sin(-player.angle) + dy * Math.cos(-player.angle);
        
        // Рисуем точку-индикатор положения центра цели
        ctx.fillStyle = Math.hypot(dx, dy) < 15 ? '#00ff66' : '#ff3333';
        ctx.beginPath();
        ctx.arc(cx + Math.max(-100, Math.min(100, screenDx)), cy + Math.max(-100, Math.min(100, screenDy)), 4, 0, Math.PI*2);
        ctx.fill();


        // --- ТЕЛЕМЕТРИЯ (Текст) ---
        ctx.font = 'bold 14px Courier New';
        
        // Расчет параметров для вывода
        const distErr = Math.hypot(dx, dy);
        const rotDiff = (target.vAngle - player.vAngle) * 1000; // Условные град/сек
        
        let angleDiff = (target.angle - player.angle) % (Math.PI * 2);
        if (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        if (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        const angleErr = angleDiff * (180 / Math.PI);

        // Левый верхний угол: Дистанция и Скорость
        ctx.fillStyle = '#00ff66';
        ctx.fillText(`ДИСТ : ${player.z.toFixed(1)} м`, 20, 35);
        
        const vColor = -player.vz > 0.6 ? '#ff3333' : (-player.vz > 0 ? '#ffaa00' : '#00ff66');
        ctx.fillStyle = vColor;
        ctx.fillText(`СКОР : ${(-player.vz * 10).toFixed(1)} м/с`, 20, 55);

        // Правый верхний угол: Ошибки синхронизации
        ctx.textAlign = 'right';
        
        // 1. Смещение
        ctx.fillStyle = distErr < 15 ? '#00ff66' : '#ff3333';
        ctx.fillText(`ОСЬ X/Y: ${distErr < 15 ? 'НОРМА' : 'СБОЙ'}`, canvas.width - 20, 35);

        // 2. Вращение
        ctx.fillStyle = Math.abs(rotDiff) < 5 ? '#00ff66' : '#ffaa00';
        ctx.fillText(`СИНХР.ВРАЩ: ${rotDiff > 0 ? '+' : ''}${rotDiff.toFixed(1)}`, canvas.width - 20, 55);

        // 3. Угол
        ctx.fillStyle = Math.abs(angleErr) < 15 ? '#00ff66' : '#ffaa00';
        ctx.fillText(`УГОЛ: ${angleErr.toFixed(0)}°`, canvas.width - 20, 75);

        ctx.textAlign = 'left'; // Сброс

        // Предупреждение по центру, если все хорошо и можно жать вперед
        if (distErr < 15 && Math.abs(rotDiff) < 5 && Math.abs(angleErr) < 15) {
            ctx.fillStyle = '#00ff66';
            ctx.textAlign = 'center';
            ctx.fillText(`[ ЗАХВАТ ЦЕЛИ - РАЗРЕШЕНО СБЛИЖЕНИЕ ]`, cx, canvas.height - 20);
            ctx.textAlign = 'left';
        }

        // Рамка камеры
        ctx.strokeStyle = 'rgba(0, 255, 102, 0.2)';
        ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
    }

    // Игровой цикл
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
